name: Build and Push Docker Image

# 触发条件：push 到 main 分支，或手动在 Actions 页面点按钮运行
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取 GitHub 仓库代码到 CI 机器
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Docker Buildx（多平台构建工具）
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录 Docker Hub（账号和 Token 来自 GitHub Secrets）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 提取镜像标签：latest + 当前 commit 短哈希
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jiajiangjiangyuyuyu/mlops-iris
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 5. 构建镜像并推送到 Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
